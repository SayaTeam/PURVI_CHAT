services:
  - type: worker
    name: SonaliChat
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m SonaliChat.__main__
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URL
        sync: false
      - key: AUTH_CHANNEL
        sync: false
      - key: OWNER_ID
        sync: false
      - key: API_KEY
        sync: false
